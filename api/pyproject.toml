[project]
name = "soonfinance"
version = "0.1.0"
description = "API Soon Finance"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soonfinance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
