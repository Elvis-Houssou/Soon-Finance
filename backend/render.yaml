services:
  - type: web
    name: soon-finance-backend
    runtime: python
    rootDir: backend
    # requirements.txt est généré depuis uv.lock : python -m uv export --no-dev --no-hashes --no-emit-project -o requirements.txt
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false # URL Neon, à saisir dans le tableau de bord Render
      - key: ENV
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_URL
        sync: false # URL du site (Vercel), origine autorisée par CORS
      - key: API_URL
        sync: false # URL publique de cette API (Render), cible des liens magiques
      - key: ADMIN_EMAILS
        sync: false
