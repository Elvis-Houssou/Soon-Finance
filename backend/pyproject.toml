[project]
name = "soon-finance-backend"
version = "0.1.0"
description = "Backend FastAPI de Soon Finance"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
